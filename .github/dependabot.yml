# Atualizações automáticas de dependências (PRs semanais, agrupados).
# Segurança: patches de vulnerabilidade viram PRs; revisar e mergear com CI verde.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Agrupa patches/minors não-disruptivos num único PR por semana.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
